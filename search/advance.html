<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav-links">
        <a href="index.html">Google Search</a>
    </div>

    <div class="advanced-container">
        <h2 class="advanced-title">Google Advanced Search</h2>

        <form action="https://www.google.com/search" method="get" class="advanced-form">
            <div class="field-row-header">
                <h3>Find pages with...</h3>
            </div>
            
            <div class="field-row">
                <label for="all-words" class="label-text">all these words:</label>
                <input type="text" name="as_q" id="all-words" class="advanced-input">
            </div>

            <div class="field-row">
                <label for="exact-phrase" class="label-text">this exact word or phrase:</label>
                <input type="text" name="as_epq" id="exact-phrase" class="advanced-input">
            </div>
            
            <div class="field-row">
                <label for="any-words" class="label-text">any of these words:</label>
                <input type="text" name="as_oq" id="any-words" class="advanced-input">
            </div>
            
            <div class="field-row">
                <label for="none-words" class="label-text">none of these words:</label>
                <input type="text" name="as_eq" id="none-words" class="advanced-input">
            </div>

            <div class="advanced-button-container">
                <input type="submit" value="Advanced Search" class="advanced-btn">
            </div>
        </form>
    </div>
</body>
</html>
